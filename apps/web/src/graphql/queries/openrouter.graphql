query GetOpenRouterModels {
  openRouterModels {
    id
    name
    details
  }
}

query GetOpenRouterModel($modelId: String!) {
  openRouterModel(modelId: $modelId) {
    id
    name
    details
  }
}

query GetOpenRouterAccountCredits($workspaceId: String!) {
  openRouterAccountCredits(workspaceId: $workspaceId) {
    totalCredits
    usedCredits
    availableCredits
  }
}