# Authentication Queries

# Get current authenticated user
query CurrentUser {
  currentUser {
    id
    token
    roles
    user {
      id
      username
      email
      createdAt
      firstName
      lastName
      fullName
      isOnboarded
      avater
      followersCount
      followingCount
      settings {
        statusText
        statusUpdatedAt
        socialLinks
        wallets
      }
    }
    __typename
  }
}

# Get a user's public profile
query GetProfile($username: String!) {
  profile(username: $username) {
    username
    bio
    image
    following
  }
}

# Get users who follow a specific user
query GetUserFollowers($userId: String!) {
  getUserFollowers(userId: $userId) {
    id
    username
    email
    firstName
    lastName
    avater
    followersCount
    followingCount
  }
}

# Get users that a specific user is following
query GetUserFollowing($userId: String!) {
  getUserFollowing(userId: $userId) {
    id
    username
    email
    firstName
    lastName
    avater
    followersCount
    followingCount
  }
}
