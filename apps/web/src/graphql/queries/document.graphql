query GetDocument($workspaceId: String!, $documentId: String!) {
  getDocument(workspaceId: $workspaceId, documentId: $documentId) {
    id
    title
    slug
    icon
    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

query GetExplorerDocuments($limit: Float = 20, $offset: Float = 0) {
  getExplorerDocuments(limit: $limit, offset: $offset) {
    id
    slug
    title
    authorId
    workspaceId
    parentId
    runUnexecutedBlocks
    runSQLSelection
    shareLinksWithoutSidebar
    orderIndex
    deletedAt
    createdAt
    updatedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    children {
      id
      slug
      title
      icon
      orderIndex
    }
    parent {
      id
      slug
      title
      icon
    }
      author{
      username
      firstName
      lastName
      avater
    }
  }
}


