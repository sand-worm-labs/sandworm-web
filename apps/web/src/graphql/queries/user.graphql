# 2. Get User's Favorite Public Documents
query GetUserFavoritePublicDocuments($userId: String!) {
    favoritePublicDocuments {
      id
      slug
      title
      authorId
      workspaceId
      parentId
      runUnexecutedBlocks
      runSQLSelection
      shareLinksWithoutSidebar
      icon
      orderIndex
      deletedAt
      createdAt
      updatedAt
      version
      publishedAt
      isDataApp
      isSyncedWithYjs
      hasDashboard
      appId
      clock
      appClock
      userAppClock
      children {
        id
        slug
        title
        authorId
        icon
        orderIndex
        createdAt
        updatedAt
      }
      parent {
        id
        slug
        title
        authorId
        icon
      }
  }
}

