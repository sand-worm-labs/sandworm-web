# 4. Get Trending Published Documents
query GetTrendingPublishedDocuments($limit: Float = 20, $offset: Float = 0) {
  getTrendingPublishedDocuments(limit: $limit, offset: $offset) {
    id
    slug
    title
    authorId
    workspaceId
    parentId
    runUnexecutedBlocks
    runSQLSelection
    shareLinksWithoutSidebar
    icon
    orderIndex
    deletedAt
    createdAt
    updatedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    children {
      id
      slug
      title
      icon
      orderIndex
    }
    parent {
      id
      slug
      title
      icon
    }
  }
}

