# 3. Get Forked Documents (Standalone Query)
query GetForkedDocuments {
  getForkedDocuments {
    id
    slug
    title
    authorId
    workspaceId
    parentId
    runUnexecutedBlocks
    runSQLSelection
    shareLinksWithoutSidebar
    icon
    orderIndex
    deletedAt
    createdAt
    updatedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    children {
      id
      slug
      title
      icon
      orderIndex
      createdAt
      updatedAt
    }
    parent {
      id
      slug
      title
      icon
    }
  }
}

query GetUserPublicDocuments($userId: String!, $limit: Float = 20, $offset: Float = 0) {
  getUserPublicDocuments(userId: $userId, limit: $limit, offset: $offset) {
    ...DocumentFields
     author{
      username
      firstName
      lastName
      avater
    }
  }
}
