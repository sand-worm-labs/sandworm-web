# 1. Get User by ID (with full UserSetting fields)
query GetUser($userId: String!) {
  getUser(userId: $userId) {
    id
    username
    email
    firstName
    lastName
    fullName
    isOnboarded
    avater
    createdAt
    settings {
      id
      userId
      socialLinks
      statusText
      statusUpdatedAt
      wallets
    }
    followers {
      id
      username
      fullName
      avater
    }
    following {
      id
      username
      fullName
      avater
    }
    followersCount
    followingCount
  }
}
# Variables:
# {
#   "userId": "user_123"
# }


