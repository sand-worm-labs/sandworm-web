query GetSchedules($input: ListSchedulesInput!) {
  schedules(input: $input) {
    id
    type
    hour
    minute
    cron
    weekdays
    days
    timezone
    isActive
    lastExecutedAt
    nextExecutionAt
    documentId
  }
}

query GetSchedule($scheduleId: String!) {
  schedule(scheduleId: $scheduleId) {
    id
    documentId
    cron
    type
    isActive
    hour
    minute
    timezone
    days
    weekdays
    lastExecutedAt
    nextExecutionAt
  }
}
