query GetComment($commentId: String!) {
  comment(commentId: $commentId) {
    id
    documentId
    authorId
    body
    createdAt
    updatedAt
  }
}

query GetDocumentComments($documentId: String!) {
  comments(documentId: $documentId) {
    id
    documentId
    authorId
    body
    createdAt
    updatedAt
  }
}
