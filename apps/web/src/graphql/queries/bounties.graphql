fragment BountyWinnerFields on BountyWinner {
  place
  author
  notebookSlug
  amount
  address
}

query GetBounties {
  getBounties {
    slug
    title
    sponsor
    type
    reward
    status
    summary
    winners {
      ...BountyWinnerFields
    }
    sample
    onchainId
  }
}

query GetBounty($slug: String!) {
  getBounty(slug: $slug) {
    slug
    title
    sponsor
    type
    reward
    status
    summary
    background
    requirements
    deliverables
    prizes
    judging
    dataHints
    winners {
      ...BountyWinnerFields
    }
    postedOn
    sample
    details
    deadline
    status
    chainId
    onchainId
    sponsorAddress
    fundTxHash
    rewardToken
    rewardAmount
  }
}

query GetBountyDrafts($workspaceId: String!) {
  getBountyDrafts(workspaceId: $workspaceId) {
    slug
    title
    sponsor
    type
    reward
    status
    summary
    winners {
      ...BountyWinnerFields
    }
    sample
    onchainId
    rewardToken
    rewardAmount
    deadline
  }
}

query GetBountyEntries($slug: String!) {
  getBountyEntries(slug: $slug) {
    id
    documentId
    author
    notebookTitle
    notebookSlug
    wallet
    submittedAt
    isMine
  }
}

query GetMyBountyEntries {
  getMyBountyEntries {
    id
    bountySlug
    documentId
    submittedAt
  }
}
