mutation EditTitleWithAi($documentId: String!, $workspaceId: String!) {
  editTitleWithAi(documentId: $documentId, workspaceId: $workspaceId)
}

mutation EditSqlWithAi(
  $documentId: String!
  $workspaceId: String!
  $blockId: String!
) {
  editSqlWithAi(
    documentId: $documentId
    workspaceId: $workspaceId
    blockId: $blockId
  )
}

mutation EditPythonWithAi(
  $documentId: String!
  $workspaceId: String!
  $blockId: String!
) {
  editPythonWithAi(
    documentId: $documentId
    workspaceId: $workspaceId
    blockId: $blockId
  )
}

mutation FixSqlWithAi(
  $documentId: String!
  $workspaceId: String!
  $blockId: String!
) {
  fixSqlWithAi(
    documentId: $documentId
    workspaceId: $workspaceId
    blockId: $blockId
  ) {
    chatId
  }
}

mutation FixPythonWithAi(
  $documentId: String!
  $workspaceId: String!
  $blockId: String!
) {
  fixPythonWithAi(
    documentId: $documentId
    workspaceId: $workspaceId
    blockId: $blockId
  ) {
    chatId
  }
}

mutation EditTextWithAi(
  $documentId: String!
  $workspaceId: String!
  $blockId: String!
) {
  editTextWithAi(
    documentId: $documentId
    workspaceId: $workspaceId
    blockId: $blockId
  )
}
