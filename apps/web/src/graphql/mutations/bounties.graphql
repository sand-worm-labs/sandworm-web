mutation CreateBounty($input: CreateBountyInput!) {
  createBounty(input: $input) {
    slug
    title
    status
  }
}

mutation ConfirmBountyFunding($slug: String!, $chainId: Int!, $txHash: String!) {
  confirmBountyFunding(slug: $slug, chainId: $chainId, txHash: $txHash) {
    slug
    status
    chainId
    onchainId
  }
}
