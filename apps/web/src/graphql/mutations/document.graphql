mutation CreateDocument($workspaceId: String!, $input: CreateDocumentInput!) {
  createDocument(workspaceId: $workspaceId, input: $input) {
    id
    title
    slug
    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation UpdateDocument(
  $workspaceId: String!
  $documentId: String!
  $input: UpdateDocumentInput!
) {
  updateDocument(
    workspaceId: $workspaceId
    documentId: $documentId
    input: $input
  ) {
    id
    title
    slug
    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation DeleteDocument($input: DeleteDocumentInput!) {
  deleteDocument(input: $input)
}

