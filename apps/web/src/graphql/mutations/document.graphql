export fragment DocumentFields on Document {
  id
  slug
  title
  authorId
  workspaceId
  parentId
  runUnexecutedBlocks
  runSQLSelection
  shareLinksWithoutSidebar
  orderIndex
  deletedAt
  createdAt
  updatedAt
  version
  publishedAt
  isDataApp
  isSyncedWithYjs
  hasDashboard
  appId
  clock
  appClock
  userAppClock
}

mutation CreateDocument($workspaceId: String!, $input: CreateDocumentInput!) {
  createDocument(workspaceId: $workspaceId, input: $input) {
    id
    title
    slug
    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation UpdateDocument(
  $workspaceId: String!
  $documentId: String!
  $input: UpdateDocumentInput!
) {
  updateDocument(
    workspaceId: $workspaceId
    documentId: $documentId
    input: $input
  ) {
    id
    title
    slug
    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation DeleteDocument($input: DeleteDocumentInput!) {
  deleteDocument(input: $input)
}

mutation RestoreDocument($input: RestoreDocumentInput!) {
  restoreDocument(input: $input) {
    id
    title
    slug

    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation DuplicateDocument($input: DuplicateDocumentInput!) {
  duplicateDocument(input: $input) {
    id
    title
    slug

    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation PublishDocument($workspaceId: String!, $documentId: String!) {
  publishDocument(workspaceId: $workspaceId, documentId: $documentId) {
    id
    title
    slug
    parentId
    orderIndex
    authorId
    workspaceId
    createdAt
    updatedAt
    deletedAt
    version
    publishedAt
    isDataApp
    isSyncedWithYjs
    hasDashboard
    appId
    clock
    appClock
    userAppClock
    runSQLSelection
    runUnexecutedBlocks
    shareLinksWithoutSidebar
  }
}

mutation AddFavoriteDocument($input: FavoriteDocumentInput!, $publicDocument: Boolean = false) {
  addFavoriteDocument(input: $input, publicDocument: $publicDocument) {
    ...DocumentFields
  }
}

mutation RemoveFavoriteDocument($input: FavoriteDocumentInput!, $publicDocument: Boolean = false) {
  removeFavoriteDocument(input: $input, publicDocument: $publicDocument) {
    ...DocumentFields
  }
}





