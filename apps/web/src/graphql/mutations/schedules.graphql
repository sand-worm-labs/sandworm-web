mutation CreateSchedule($workspaceId: ID!, $input: CreateScheduleInput!) {
  createSchedule(workspaceId: $workspaceId, input: $input) {
    id
    type
    hour
    minute
    cron
    weekdays
    days
    timezone
    isActive
    lastExecutedAt
    nextExecutionAt
    documentId
  }
}

mutation DeleteSchedule($input: DeleteScheduleInput!) {
  deleteSchedule(input: $input)
}
