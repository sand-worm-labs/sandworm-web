worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    proxy_request_buffering off;
    client_max_body_size 0;

    upstream web {
        server web:4000;
    }

    upstream graphql {
        server graphql:8080;
    }

    upstream api {
        server api:8000;
    }


    upstream websocket {
        server websocket:8081;
    }

    server {
        listen 3000;

        location /graphql {
            proxy_pass http://graphql/graphql;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            

            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Allow-Credentials "true";
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # GraphQL Playground/Apollo Studio (development only)
        location /api-docs {
            proxy_pass http://graphql/api-docs;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint - Socket.IO
        location /socket.io/ {
            proxy_pass http://websocket/socket.io/;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific settings
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            
            # Longer timeouts for persistent connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            # Connection keep-alive
            proxy_connect_timeout 60s;
        }

        # Alternative WebSocket endpoint - Yjs collaborative editing
        location /yjs/ {
            proxy_pass http://websocket/yjs/;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific settings
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API endpoints
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for API requests
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Frontend application (catch-all)
        location / {
            proxy_pass http://web/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # For SPA routing
            try_files $uri $uri/ /index.html;
        }
    }
}