# Monitoring for a Sandworm Coolify server: a second Docker Compose resource in
# Coolify, next to the stack. Prometheus scrapes the server, its containers,
# Postgres and Redis; Grafana shows them and sends the alerts.
#
# Postgres and Redis exporters live in the app stack (they need its network);
# Prometheus reaches them over the shared sandworm-monitoring network, which
# server/bootstrap.sh creates.
#
# Prometheus and Grafana are built from this folder so their config ships from
# git instead of being bind-mounted.

services:
  prometheus:
    build:
      context: .
      dockerfile: prometheus.Dockerfile
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - prometheus-data:/prometheus
    networks: [default, monitoring]

  grafana:
    build:
      context: .
      dockerfile: grafana.Dockerfile
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    labels:
      traefik.enable: "true"
      traefik.http.routers.sandworm-grafana.rule: Host(`${GRAFANA_HOST:?}`)
      traefik.http.routers.sandworm-grafana.entrypoints: https
      traefik.http.routers.sandworm-grafana.tls: "true"
      traefik.http.routers.sandworm-grafana.tls.certresolver: letsencrypt
      traefik.http.services.sandworm-grafana.loadbalancer.server.port: "3000"
      traefik.http.routers.sandworm-grafana-http.rule: Host(`${GRAFANA_HOST:?}`)
      traefik.http.routers.sandworm-grafana-http.entrypoints: http
      traefik.http.routers.sandworm-grafana-http.middlewares: sandworm-grafana-https
      traefik.http.routers.sandworm-grafana-http.service: noop@internal
      traefik.http.middlewares.sandworm-grafana-https.redirectscheme.scheme: https

  # The server: CPU, memory, disk, network.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Every container: CPU, memory, restarts.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

networks:
  monitoring:
    external: true
    name: sandworm-monitoring

volumes:
  prometheus-data:
  grafana-data:
