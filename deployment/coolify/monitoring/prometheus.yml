global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  # In the app stack, reached over the sandworm-monitoring network.
  - job_name: postgres
    static_configs:
      - targets: ["sandworm-pg-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["sandworm-redis-exporter:9121"]
