global
    daemon

defaults
    mode http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    option httplog
    option http-server-close

# =====================================
# ⬢ Landing — sandworm.com / localhost:8080
# =====================================
frontend landing
    bind *:8080

    acl is_app_subdomain hdr(host) -i app.sandworm.com
    use_backend nextjs if is_app_subdomain
    default_backend landing

# =====================================
# ⬢ App — app.sandworm.com / localhost:8081
# =====================================
frontend app
    bind *:8081

    acl is_api path_beg /api
    acl is_socketio path_beg /socket.io
    acl is_yjs_ws hdr(Upgrade) -i websocket
    acl is_yjs_path path_beg /yjs

    use_backend yjs_servers if is_yjs_ws is_yjs_path
    use_backend api_servers if is_socketio
    use_backend api_servers if is_api
    default_backend nextjs

# =====================================
# ⬢ Astro Landing
# =====================================
backend landing
    server landing1 host.docker.internal:4321 check

# =====================================
# ⬢ Next.js App
# =====================================
backend nextjs
    server nextjs1 host.docker.internal:3000 check

# =====================================
# ⬢ NestJS API + Socket.IO
# =====================================
backend api_servers
    timeout tunnel 3600s
    server api1 host.docker.internal:8003 check

# =====================================
# ⬢ Yjs WebSocket
# =====================================
backend yjs_servers
    timeout tunnel 3600s
    server yjs1 host.docker.internal:8005 check
