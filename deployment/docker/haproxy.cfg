global
    daemon

defaults
    mode http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    option httplog
    option http-server-close

# =====================================
# ⬢ All HTTP traffic — port 8080
# =====================================
frontend main
    bind *:8080
    
    # Route /api/* to NestJS
    acl is_api path_beg /api
    # Route /yjs/* to Yjs WS — detect upgrade header
    acl is_websocket hdr(Upgrade) -i websocket

    use_backend yjs_servers if is_websocket
    use_backend api_servers if is_api
    default_backend nextjs

# =====================================
# ⬢ Next.js
# =====================================
backend nextjs
    server nextjs1 host.docker.internal:3000 check

# =====================================
# ⬢ NestJS API
# =====================================
backend api_servers
    server api1 host.docker.internal:8003 check

# =====================================
# ⬢ Yjs WebSocket
# =====================================
backend yjs_servers
    timeout tunnel 3600s
    server yjs1 host.docker.internal:8005 check
