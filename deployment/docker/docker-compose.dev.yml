networks:
  sandworm-net:
    driver: bridge

volumes:
  sandworm-postgres-data:
  sandworm-pgadmin-data:
  sandworm-jupyter-notebooks:
  sandworm-qdrant-data:

services:

  ###########################
  # PostgreSQL Database
  ###########################
  db:
    container_name: sandworm-postgres
    image: postgres:17
    restart: always
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: sandworm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "UTC"
    volumes:
      - sandworm-postgres-data:/var/lib/postgresql/data
    networks:
      - sandworm-net

  ###########################
  # Vector & Cache Layer
  ###########################
  qdrant:
    container_name: sandworm-qdrant
    image: qdrant/qdrant:v1.11.0
    pull_policy: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - sandworm-qdrant-data:/qdrant/storage:z
    networks:
      - sandworm-net

  redis:
    container_name: sandworm-redis
    image: redis:alpine
    networks:
      - sandworm-net

  ###########################
  # PGAdmin Web UI
  ###########################
  pgadmin:
    container_name: sandworm-pgadmin
    image: dpage/pgadmin4
    restart: always
    ports:
      - "18080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: 12345678
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    volumes:
      - sandworm-pgadmin-data:/root/.pgadmin
    networks:
      - sandworm-net
    depends_on:
      - db

  ###########################
  # MailDev SMTP & Web
  ###########################
  maildev:
    container_name: sandworm-maildev
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - sandworm-net

  ###########################
  # Jupyter Service (Unchanged)
  ###########################
  jupyter:
    container_name: sandworm-jupyter
    platform: linux/arm64
    build:
      context: ../../apps/jupyter
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    restart: always
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?error}
    volumes:
      - sandworm-jupyter-notebooks:/home/sandwormuser/work
      - ./jupyterfiles:/home/sandwormuser/files
    networks:
      - sandworm-net
    command: >
      jupyter server --ip=0.0.0.0 --ZMQChannelsWebsocketConnection.iopub_data_rate_limit=1.0e10 --ZMQChannelsWebsocketConnection.iopub_msg_rate_limit=1.0e6 --ServerApp.max_body_size=107374182400 --no-browser
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8888/api || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 5 

  ###########################
  # HAProxy Gateway
  ###########################
  haproxy:
    container_name: sandworm-proxy
    image: haproxy:3.0
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - '8080:8080'
    networks:
      - sandworm-net
  ###########################
  # Logdy Log Viewer
  ###########################
  logdy:
    container_name: sandworm-logdy
    image: rickraven/logdy:0.14.0
    restart: unless-stopped
    ports:
      - "8475:8080"
      - "10800:10800"
    environment:
      LOGDY_MODE: "socket"
      LOGDY_SOCKET_PORTS: "10800"
    networks:
      - sandworm-net