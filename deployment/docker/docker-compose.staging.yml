networks:
  sandworm-net:
    driver: bridge

volumes:
  sandworm-postgres-data:
  sandworm-jupyter-notebooks:
  sandworm-qdrant-data:
  sandworm-redis-data:
  sandworm-portainer-data:
  sandworm-caddy-data:
  sandworm-caddy-config:

services:
  ###########################
  # Redis
  ###########################
  redis:
    container_name: sandworm-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - sandworm-redis-data:/data
    networks:
      - sandworm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ###########################
  # Redis Commander UI
  ###########################
  redis-commander:
    container_name: sandworm-redis-ui
    image: rediscommander/redis-commander:latest
    restart: always
    ports:
      - "127.0.0.1:5050:8081"
    environment:
      REDIS_HOSTS: "local:sandworm-redis:6379"
    networks:
      - sandworm-net
    depends_on:
      - redis

  ###########################
  # PostgreSQL Database
  ###########################
  db:
    container_name: sandworm-postgres
    image: postgres:17
    restart: always
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_DB: sandworm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "UTC"
    volumes:
      - sandworm-postgres-data:/var/lib/postgresql/data
    networks:
      - sandworm-net

  ###########################
  # Vector & Cache Layer
  ###########################
  qdrant:
    container_name: sandworm-qdrant
    image: qdrant/qdrant:v1.11.0
    pull_policy: always
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - sandworm-qdrant-data:/qdrant/storage:z
    networks:
      - sandworm-net

  ###########################
  # DbGate Web UI
  ###########################
  dbgate:
    container_name: sandworm-dbgate
    image: dbgate/dbgate:alpine
    restart: always
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      CONNECTIONS: db
      LABEL_db: Sandworm
      SERVER_db: sandworm-postgres
      USER_db: postgres
      PASSWORD_db: postgres
      PORT_db: 5432
      ENGINE_db: postgres@dbgate-plugin-postgres
    networks:
      - sandworm-net
    depends_on:
      - db

  ###########################
  # MailDev SMTP & Web
  ###########################
  maildev:
    container_name: sandworm-maildev
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"
    networks:
      - sandworm-net

  ###########################
  # Jupyter Service
  ###########################
  jupyter:
    container_name: sandworm-jupyter
    platform: linux/arm64
    build:
      context: ../../apps/jupyter
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    restart: always
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?error}
    volumes:
      - sandworm-jupyter-notebooks:/home/sandwormuser/work
      - ./jupyterfiles:/home/sandwormuser/files
    networks:
      - sandworm-net
    command: >
      jupyter server --ip=0.0.0.0
      --ZMQChannelsWebsocketConnection.iopub_data_rate_limit=1.0e10
      --ZMQChannelsWebsocketConnection.iopub_msg_rate_limit=1.0e6
      --ServerApp.max_body_size=107374182400
      --no-browser
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/api || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  ###########################
  # Caddy Gateway
  ###########################
  caddy:
    container_name: sandworm-proxy
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - sandworm-caddy-data:/data
      - sandworm-caddy-config:/config
    networks:
      - sandworm-net

  ###########################
  # Portainer Docker UI
  ###########################
  portainer:
    container_name: sandworm-portainer
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandworm-portainer-data:/data
    networks:
      - sandworm-net

  ###########################
  # Logdy Log Viewer
  ###########################
  logdy:
    container_name: sandworm-logdy
    image: rickraven/logdy:0.14.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8475:8080"
      - "127.0.0.1:10800:10800"
    environment:
      LOGDY_MODE: "socket"
      LOGDY_SOCKET_PORTS: "10800"
    networks:
      - sandworm-net
